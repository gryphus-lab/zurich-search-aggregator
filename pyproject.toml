[project]
name = "zurich-search-aggregator"
version = "0.1.0"
description = "CLI tool to scrape and filter furnished apartments in Zurich"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "fastapi>=0.115.0",
    "filters>=1.3.2",
    "httpx>=0.28.1",
    "lxml>=6.1.0",
    "pandas>=3.0.2",
    "playwright>=1.59.0",
    "playwright-stealth>=2.0.3",
    "pydantic>=2.13.3",
    "python-dateutil>=2.9.0",
    "python-dotenv>=1.2.2",
    "rich>=15.0.0",
    "typer>=0.25.1",
    "uvicorn>=0.34.0",
]

[project.optional-dependencies]
# Durable, out-of-process job queue (JobRunr-style) backed by Redis + RQ.
# Install with: uv sync --extra rq. The in-process 'memory' backend (the
# default, JOB_BACKEND=memory) needs none of this; these are only required to
# run with JOB_BACKEND=rq or to run an `rq worker`.
rq = [
    "rq>=2.0.0",
    "redis>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aggregator"]

[tool.uv]
managed = true

[tool.uv.sources]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.11",
]
