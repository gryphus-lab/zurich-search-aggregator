services:
  aggregator:
    image: zurich-search-aggregator:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zurich-search-aggregator
    restart: unless-stopped
    environment:
      - TZ=Europe/Zurich
      - HOST=0.0.0.0
      - PORT=8000
    ports:
      - "8000:8000"
    # Persist scrape output on the host.
    volumes:
      - ./results:/app/results
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8000/health').status==200 else sys.exit(1)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
