version: "3.8"

services:
  n8n:
    image: zurich-search-aggregator:latest
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - GENERIC_TIMEZONE=Europe/Zurich
      - TZ=Europe/Zurich
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=change_this_to_a_strong_password
      - N8N_ENCRYPTION_KEY=your_super_secret_encryption_key_here # Generate a strong one
      - N8N_RESTRICT_FILE_ACCESS_TO=/files,/app/results
    volumes:
      - ./n8n_data:/home/node/.n8n
      - ./:/app
      - ./results:/app/results
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:5678/healthz",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
