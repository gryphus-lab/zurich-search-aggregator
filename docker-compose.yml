services:
  aggregator:
    image: zurich-search-aggregator:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zurich-search-aggregator
    environment:
      - TZ=Europe/Zurich
    # The aggregator is a batch CLI, not a long-running service. Override the
    # command to pass search parameters, e.g.:
    #   docker compose run --rm aggregator --metro --min 1700 --max 3500 --csv
    command: ["--help"]
    # Persist scrape output on the host.
    volumes:
      - ./results:/app/results
