[tools]
python = "3.14"
uv = "latest"

[env]
PROJECT_NAME = "{{ config_root | basename }}"

[settings]
python.uv_venv_auto = false

[tasks.bootstrap]
description = "Install dependencies and Playwright Chromium"
alias = "i"
run = [
  "uv sync --all-groups",
  "uv run playwright install chromium --with-deps",
]

[tasks.info]
description = "Print project information"
run = '''
echo "Project: $PROJECT_NAME"
echo "Python: $(python --version)"
'''

[tasks.run]
description = "Run the aggregator with default filters"
run = "uv run python -m src.aggregator.main"
depends = ["bootstrap"]

[tasks.scrape]
description = "Run scrape with custom CLI arguments"
run = "uv run python -m src.aggregator.main"
depends = ["bootstrap"]

[tasks.lint]
description = "Lint and check formatting with Ruff"
run = "uv run ruff check . && uv run ruff format --check ."

[tasks.format]
description = "Format and fix code with Ruff"
run = "uv run ruff format . && uv run ruff check --fix ."

[tasks.test]
description = "Run tests with pytest"
run = "uv run pytest tests -v"
depends = ["bootstrap"]

[tasks.coverage]
description = "Run tests with coverage report"
run = "uv run pytest tests --cov=. --cov-report=term-missing --cov-report=xml:coverage.xml"
depends = ["bootstrap"]

[tasks.docker-compose]
description = "Start services with Docker Compose in detached mode"
run = "docker compose up -d"

[tasks.docker-build]
description = "Build the Docker image with pinned n8n version"
run = "docker build -t zurich-search-aggregator:latest -f Dockerfile . --build-arg N8N_VERSION=2.15.0"
