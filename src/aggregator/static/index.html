<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Zurich Search Aggregator</title>
<style>
  :root {
    --black: #161616;
    --white: #ffffff;
    --grey: #f4f4f4;
    --yellow: #ffe600;
    --line: #e3e3e3;
    --muted: #6b6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Chip Text', system-ui, -apple-system, sans-serif;
    color: var(--black);
    background: var(--white);
    line-height: 1.5;
  }
  header {
    background: var(--black);
    color: var(--white);
    padding: 20px 24px;
  }
  header .eyebrow {
    font-family: 'Chip Mono', ui-monospace, monospace;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-size: 12px;
    color: var(--yellow);
    margin: 0 0 4px;
  }
  header h1 {
    font-family: 'Chip Display', system-ui, sans-serif;
    font-size: 24px;
    margin: 0;
  }
  main { max-width: 1100px; margin: 0 auto; padding: 24px; }
  .card {
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 24px;
    background: var(--white);
  }
  h2 {
    font-family: 'Chip Display', system-ui, sans-serif;
    font-size: 18px;
    margin: 0 0 16px;
  }
  form { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field.full { grid-column: 1 / -1; }
  label { font-size: 13px; font-weight: 600; }
  .hint { font-size: 12px; color: var(--muted); font-weight: 400; }
  input[type="number"], input[type="date"], input[type="url"], select {
    padding: 9px 10px;
    border: 1px solid var(--line);
    border-radius: 8px;
    font: inherit;
    background: var(--white);
  }
  select[multiple] { height: 150px; }
  .checks { display: flex; flex-wrap: wrap; gap: 18px; }
  .check { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500; }
  .actions { grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; }
  button {
    font: inherit;
    font-weight: 600;
    border: 0;
    border-radius: 9999px;
    padding: 11px 22px;
    cursor: pointer;
    background: var(--yellow);
    color: var(--black);
  }
  button.secondary { background: var(--grey); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  #formMsg { font-size: 13px; }
  #formMsg.error { color: #b00020; }
  #formMsg.ok { color: #0a7d33; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-family: 'Chip Mono', ui-monospace, monospace; text-transform: uppercase; font-size: 11px; letter-spacing: 0.05em; color: var(--muted); }
  td.job-id { font-family: 'Chip Mono', ui-monospace, monospace; font-size: 12px; }
  .pill {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 9999px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .pill.pending { background: var(--grey); color: var(--muted); }
  .pill.running { background: #fff6a8; color: #6b5e00; }
  .pill.done { background: #d8f5e0; color: #0a7d33; }
  .pill.error { background: #fde0e3; color: #b00020; }
  a.result-link { color: var(--black); font-weight: 600; text-underline-offset: 2px; }
  .empty { color: var(--muted); font-style: italic; }
  .row-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .row-head h2 { margin: 0; }
  .refresh-note { font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<header>
  <p class="eyebrow">Zurich Search Aggregator</p>
  <h1>Apartment search console</h1>
</header>

<main>
  <section class="card">
    <h2>New search</h2>
    <form id="searchForm">
      <div class="field">
        <label for="price_min">Min rent (CHF)</label>
        <input type="number" id="price_min" name="price_min" value="1700" min="0" step="50" />
      </div>
      <div class="field">
        <label for="price_max">Max rent (CHF)</label>
        <input type="number" id="price_max" name="price_max" value="3000" min="0" step="50" />
      </div>
      <div class="field">
        <label for="move_in_from">Earliest move-in <span class="hint">(optional)</span></label>
        <input type="date" id="move_in_from" name="move_in_from" />
      </div>
      <div class="field">
        <label for="max_pages">Max pages per location</label>
        <input type="number" id="max_pages" name="max_pages" value="5" min="1" max="20" />
      </div>
      <div class="field">
        <label for="neighborhoods">Locations <span class="hint">(none = default/metro)</span></label>
        <select id="neighborhoods" name="neighborhoods" multiple></select>
      </div>
      <div class="field">
        <label for="sources">Sources <span class="hint">(none = all)</span></label>
        <select id="sources" name="sources" multiple></select>
      </div>
      <div class="field full">
        <label for="callback_url">Callback webhook URL <span class="hint">(optional)</span></label>
        <input type="url" id="callback_url" name="callback_url" placeholder="https://example.com/hook" />
      </div>
      <div class="field full">
        <div class="checks">
          <span class="check"><input type="checkbox" id="metro" name="metro" /> <label for="metro">Search whole metro region</label></span>
          <span class="check"><input type="checkbox" id="only_flexible" name="only_flexible" /> <label for="only_flexible">Month-to-month only</label></span>
          <span class="check"><input type="checkbox" id="furnished_only" name="furnished_only" /> <label for="furnished_only">Furnished only</label></span>
        </div>
      </div>
      <div class="actions">
        <button type="submit" id="submitBtn">Start search</button>
        <span id="formMsg"></span>
      </div>
    </form>
  </section>

  <section class="card">
    <div class="row-head">
      <h2>Jobs</h2>
      <span class="refresh-note">Auto-refreshes every 3s</span>
    </div>
    <table>
      <thead>
        <tr>
          <th>Job</th><th>Status</th><th>Results</th><th>Created</th><th>Finished</th><th>Detail</th>
        </tr>
      </thead>
      <tbody id="jobsBody">
        <tr><td colspan="6" class="empty">No jobs yet.</td></tr>
      </tbody>
    </table>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);

function fillSelect(sel, values) {
  sel.innerHTML = "";
  for (const v of values) {
    const opt = document.createElement("option");
    opt.value = v; opt.textContent = v;
    sel.appendChild(opt);
  }
}

async function loadFormOptions() {
  try {
    const [loc, src] = await Promise.all([
      fetch("/locations").then((r) => r.json()),
      fetch("/sources").then((r) => r.json()),
    ]);
    fillSelect($("neighborhoods"), loc.metro || []);
    fillSelect($("sources"), src.sources || []);
  } catch (e) {
    setMsg("Could not load form options: " + e, "error");
  }
}

function setMsg(text, cls) {
  const el = $("formMsg");
  el.textContent = text;
  el.className = cls || "";
}

function selectedValues(sel) {
  return Array.from(sel.selectedOptions).map((o) => o.value);
}

function buildPayload() {
  const payload = {
    price_min: Number($("price_min").value),
    price_max: Number($("price_max").value),
    max_pages: Number($("max_pages").value),
    metro: $("metro").checked,
    only_flexible: $("only_flexible").checked,
    furnished_only: $("furnished_only").checked,
  };
  const move = $("move_in_from").value;
  if (move) payload.move_in_from = move;
  const neighs = selectedValues($("neighborhoods"));
  if (neighs.length) payload.neighborhoods = neighs;
  const srcs = selectedValues($("sources"));
  if (srcs.length) payload.sources = srcs;
  const cb = $("callback_url").value.trim();
  if (cb) payload.callback_url = cb;
  return payload;
}

$("searchForm").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const btn = $("submitBtn");
  btn.disabled = true;
  setMsg("Submitting…", "");
  try {
    const resp = await fetch("/search", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(buildPayload()),
    });
    const body = await resp.json();
    if (resp.ok) {
      setMsg("Job started: " + body.job_id, "ok");
      refreshJobs();
    } else {
      const detail = Array.isArray(body.detail)
        ? body.detail.map((d) => d.msg).join("; ")
        : body.detail || resp.statusText;
      setMsg("Error: " + detail, "error");
    }
  } catch (e) {
    setMsg("Request failed: " + e, "error");
  } finally {
    btn.disabled = false;
  }
});

function fmt(ts) {
  if (!ts) return "—";
  const d = new Date(ts);
  return isNaN(d) ? ts : d.toLocaleString();
}

function statusPill(status) {
  return `<span class="pill ${status}">${status}</span>`;
}

function jobRow(job) {
  const results = job.results_url
    ? `<a class="result-link" href="${job.results_url}" target="_blank" rel="noopener">Download (${job.count ?? "?"})</a>`
    : (job.status === "error"
        ? `<span class="empty" title="${(job.error || "").replace(/"/g, "&quot;")}">failed</span>`
        : "—");
  return `<tr>
    <td class="job-id">${job.job_id.slice(0, 8)}</td>
    <td>${statusPill(job.status)}</td>
    <td>${results}</td>
    <td>${fmt(job.created_at)}</td>
    <td>${fmt(job.finished_at)}</td>
    <td><a class="result-link" href="/search/${job.job_id}" target="_blank" rel="noopener">status</a></td>
  </tr>`;
}

async function refreshJobs() {
  try {
    const jobs = await fetch("/jobs").then((r) => r.json());
    const body = $("jobsBody");
    if (!jobs.length) {
      body.innerHTML = `<tr><td colspan="6" class="empty">No jobs yet.</td></tr>`;
      return;
    }
    body.innerHTML = jobs.map(jobRow).join("");
  } catch (e) {
    // Keep the last-rendered table on transient errors.
  }
}

loadFormOptions();
refreshJobs();
setInterval(refreshJobs, 3000);
</script>
</body>
</html>
